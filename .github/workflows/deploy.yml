on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  deploy_on_gh_pages:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v2.1.3
      with:
        node-version: '20'
    - name: Install Chrome runtime deps for puppeteer
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libnss3 \
          libasound2t64 libcups2t64 libgbm1 libxkbcommon0 libpango-1.0-0 \
          libxcomposite1 libxdamage1
    - run: |
        yarn install --frozen-lockfile
        yarn build
    - run: git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${{github.repository}}.git
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - run: npx -y -p gh-pages@3.1.0 gh-pages -d dist -u "github-actions-bot <support+actions@github.com>"